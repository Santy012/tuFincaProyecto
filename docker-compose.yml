# Project: TuFinca v1.0
# Author: Santiago Castellanos, Catalina Gutiérrez, Camilo Millan
# Description: Sistema de gestión inmobiliaria
# Date: 2025-04

services:
  backend:
    build:
      context: ./backend/tuFinca
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://database:3306/tuFinca?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota"
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL-AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      UPLOAD_DIRECTORY: /app/uploads
    volumes:
      - uploads_volume:/app/uploads
    #ports:
    #  - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - finca-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    #ports:
    #  - "80:80"
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - finca-network

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - finca-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Nuevo servicio: Nginx Proxy Manager
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'     # Puerto HTTP
      - '443:443'   # Puerto HTTPS
      - '81:81'     # Puerto Admin UI
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - finca-network

volumes:
  db_data:
  uploads_volume:
  npm_data:
  npm_letsencrypt:

networks:
  finca-network:
    driver: bridge