# =============================================
# Configuraci�n para Entorno Docker (PRODUCCI�N)
# =============================================

# Configuraciones Generales
spring.application.name=tuFinca

# Configuraci�n del Servidor
server.port=8080

# Configuraci�n de la Base de Datos (MySQL en Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.tomcat.connection-properties=serverTimezone=America/Bogota

# Configuraci�n de Hibernate/JPA
# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuraci�n de Archivos
upload.directory=${UPLOAD_DIRECTORY:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/uploads/**

spring.web.resources.static-locations=file:${upload.directory}

# Configuraci�n JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Swagger (Desactivar en producci�n por defecto)
springdoc.swagger-ui.enabled=false

frontend.url=http://localhost:80