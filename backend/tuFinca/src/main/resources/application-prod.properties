# Configuración del perfil prod (el que activa el Dockerfile).
# Los datos de conexión y los secretos llegan por variables de entorno desde docker-compose.yml y .env.
spring.application.name=tuFinca
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false


upload.directory=${UPLOAD_DIRECTORY:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:${upload.directory}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

thumbnailator.quality=0.8
thumbnailator.max-width=1200
thumbnailator.max-height=1200

springdoc.swagger-ui.enabled=false
